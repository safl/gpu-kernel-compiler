#
# Every version in the image is pinned, so a rebuild without a change to
# what goes into it would produce the same image: build only then.
#
# Podman rather than Docker: the smoke test mounts NVIDIA's image, and
# Docker's image mounts need the containerd image store, which the runner's
# Docker 28 does not use.

name: image

on:
  push:
    branches: [main]
    paths: &paths
      - Dockerfile
      - .dockerignore
      - LICENSE
      - Makefile
      - gkcc
      - kobj_check.py
      - hipother.sha256
      - targets
      - nvidia-image
      - tests/**
      - .github/workflows/image.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENGINE: podman

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim disk space
        # NVIDIA's devel image, which the smoke test mounts, is about 9 GB unpacked
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - run: make build ENGINE=$ENGINE

      - run: make smoke ENGINE=$ENGINE

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          make push ENGINE=$ENGINE TAGS="${GITHUB_SHA::12}"
