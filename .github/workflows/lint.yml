name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pipx install pre-commit && pipx install pytest
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: make test
